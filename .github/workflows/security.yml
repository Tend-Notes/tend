# SPDX-License-Identifier: MIT WITH Commons-Clause
name: Security Scan

on:
  push:
    branches: [trunk]
    paths-ignore:
      - 'CHANGELOG.md'
      - 'docs/**/*.md'
  pull_request:
    branches: [trunk]

jobs:
  rust-audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    continue-on-error: true  # Informational -- don't block builds
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  clippy:
    name: Rust clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - run: cargo clippy --all-targets -- -D warnings -A dead_code -A unused_imports

  js-audit:
    name: JS dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      # No version here: pnpm/action-setup reads it from the packageManager field
      # in package.json (pnpm@10.28.0). Specifying both errors with
      # ERR_PNPM_BAD_PM_VERSION, so packageManager is the single source of truth.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - run: pnpm install --frozen-lockfile
        working-directory: packages/web
      - run: pnpm audit --audit-level moderate
        working-directory: packages/web
        continue-on-error: true  # Don't block on advisory-only findings

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    continue-on-error: true  # Informational -- don't block builds
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: semgrep --config auto --error --quiet
          --exclude='node_modules' --exclude='target' --exclude='*.lock'
          crates/ packages/web/src/
