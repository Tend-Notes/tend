[workspace]
resolver = "2"
members = [
    "crates/tend-core",
    "crates/tend-storage",
    "crates/tend-search",
    "crates/tend-git",
    "crates/tend-links",
    "crates/tend-blocks",
    "crates/tend-server",
    "crates/tend-wasm",
]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "MIT"  # With Commons Clause - see LICENSE file
authors = ["Tend Contributors"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Regex
# unicode-perl only: `\s` in the block-footer pattern is a Unicode-aware
# class, so dropping it breaks parsing at runtime (the pattern is built in a
# LazyLock, so it panics on first use rather than failing to compile). The rest
# of the Unicode tables are unused by this crate's ASCII patterns.
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }

# Web framework
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "trace", "fs", "set-header"] }
tower_governor = "0.8"
governor = "0.10"

# Search
tantivy = "0.22"

# Git
gix = { version = "0.71", default-features = false, features = ["blocking-network-client"] }

# File watching
notify = "8"
notify-debouncer-full = "0.5"

# Encryption
age = "0.11"

# Configuration
toml = "0.8"
directories = "5"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# Testing
tempfile = "3"

# Internal crates
tend-core = { path = "crates/tend-core" }
tend-storage = { path = "crates/tend-storage" }
tend-search = { path = "crates/tend-search" }
tend-git = { path = "crates/tend-git" }
tend-links = { path = "crates/tend-links" }
tend-blocks = { path = "crates/tend-blocks" }
tend-wasm = { path = "crates/tend-wasm" }

[profile.release]
lto = "thin"  # "true" requires too much RAM for small servers
strip = true
