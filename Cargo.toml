[workspace]
resolver = "2"
members = [
    "crates/tend-core",
    "crates/tend-storage",
    "crates/tend-search",
    "crates/tend-git",
    "crates/tend-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"  # With Commons Clause - see LICENSE file
authors = ["Tend Contributors"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Regex
regex = "1"

# Web framework
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "trace", "fs"] }

# Search
tantivy = "0.22"

# Git
gix = { version = "0.68", default-features = false, features = ["blocking-network-client"] }

# File watching
notify = "8"
notify-debouncer-full = "0.5"

# Markdown
comrak = "0.29"

# Configuration
toml = "0.8"
directories = "5"

# Internal crates
tend-core = { path = "crates/tend-core" }
tend-storage = { path = "crates/tend-storage" }
tend-search = { path = "crates/tend-search" }
tend-git = { path = "crates/tend-git" }

[profile.release]
lto = true
codegen-units = 1
strip = true
