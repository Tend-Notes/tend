# Docker Compose for Tend
#
# Usage:
#   docker compose up -d
#
# The garden data is persisted in the ./data directory by default.
# Override TEND_GARDEN_PATH to change the location.

services:
  tend:
    build: .
    image: tend:latest
    container_name: tend
    restart: unless-stopped
    ports:
      # Bind to loopback by default: Tend must sit behind a reverse proxy that
      # terminates TLS and enforces auth. Change to 0.0.0.0 only behind such a proxy.
      - "127.0.0.1:${TEND_PORT:-3000}:3000"
    volumes:
      - ${TEND_GARDEN_PATH:-./data}:/data
    environment:
      - TEND_HOST=0.0.0.0
      - TEND_PORT=3000
      # The server reads TEND_BASE_DIR (not TEND_GARDEN_PATH) for its data root.
      - TEND_BASE_DIR=/data
      - TEND_STATIC_DIR=/app/static
      - RUST_LOG=${RUST_LOG:-info}
      # REQUIRED for production: the reverse proxy's forward-auth verify endpoint.
      # Without it the server refuses to start (WebSocket auth would be bypassed).
      # - TEND_AUTH_VERIFY_URL=https://your-auth-proxy/api/verify
      #
      # Trusted-proxy allowlist: the server only honors the proxy-set Remote-User
      # header from these peer IPs/CIDRs, so a client reaching the port directly
      # cannot spoof a user. Defaults to loopback only.
      #  - If your reverse proxy runs on the HOST and reaches Tend over the
      #    published 127.0.0.1 port, the loopback default already works — leave
      #    this unset.
      #  - If your proxy is ANOTHER CONTAINER reaching tend over the compose
      #    network, set this to that network's subnet (find it with
      #    `docker network inspect <network>`), e.g.:
      # - TEND_TRUSTED_PROXIES=172.18.0.0/16
      # Git configuration (optional)
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME:-Tend}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL:-tend@localhost}
      - GIT_COMMITTER_NAME=${GIT_COMMITTER_NAME:-Tend}
      - GIT_COMMITTER_EMAIL=${GIT_COMMITTER_EMAIL:-tend@localhost}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
