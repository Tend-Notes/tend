[package]
name = "tend-index"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "In-memory tag and todo indices for Tend, shared by the server and the browser"

[dependencies]
serde = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
uuid = { workspace = true }
tend-core = { path = "../tend-core" }

# Same split as tend-core, for the same reasons: the one pattern here (the task
# status keyword) is ASCII, and `perf` buys the server something when it
# reindexes a whole garden but only costs bundle size in the browser.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "perf"] }

# This crate mints no uuids itself, but tend-core does, and cargo unifies
# features across the graph — so uuid's `v4` is on either way and needs a
# randomness source to build for wasm32. Same two entries as tend-wasm, and for
# the same reason: no code here calls getrandom, they exist so the feature is
# enabled when this crate is built on its own.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
