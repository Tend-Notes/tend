[package]
name = "tend-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Web server for Tend"

[[bin]]
name = "tend"
path = "src/main.rs"

[dependencies]
tend-core = { workspace = true }
tend-storage = { workspace = true }
tend-search = { workspace = true }
tend-git = { workspace = true }
tend-links = { workspace = true }
tend-blocks = { workspace = true }

# Web framework
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tower_governor = { workspace = true }
governor = { workspace = true }
futures-util = "0.3"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Configuration
toml = { workspace = true }
directories = { workspace = true }

# Date/time
chrono = { workspace = true }

# UUID
uuid = { workspace = true }

# Regex
regex = { workspace = true }

# CIDR parsing/matching for the trusted-proxy allowlist (already in the tree via
# hyper/reqwest; pinned here as a direct dep for the proxy_guard middleware)
ipnet = "2.11"

# URL encoding for Logseq import
urlencoding = "2.1"

# Scope guard for cleanup
scopeguard = "1.2"

# HTTP client (for auth verification)
reqwest = { workspace = true }

# Multipart file uploads
axum-extra = { version = "0.10", features = ["multipart"] }

# Zip file handling
zip = "2.2"

# Tempfile for extraction
tempfile = { workspace = true }

# Streaming utilities
tokio-stream = "0.1"
